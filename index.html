<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="YT SOLUTION 회사소개서 및 주요 레퍼런스 포트폴리오">
  <title>YT SOLUTION | Company Profile</title>
  <style>
    :root{color-scheme:light;--navy:#123d70;--blue:#1689c7;--ink:#172b3d;--muted:#687b8b;--line:#dce5ec}
    *{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:var(--ink);font-family:Arial,"Noto Sans KR",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line)}
    .wrap{width:min(1180px,calc(100% - 40px));margin:auto}
    .top{height:78px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand-logo{display:block;width:220px;max-width:48vw;height:auto;object-fit:contain}
    .tag{font-size:11px;letter-spacing:.16em;color:var(--muted)}
    main{padding:42px 0 60px}
    .hero{background:linear-gradient(120deg,#0e3768,#176ca8 68%,#22a0d1);border-radius:14px;color:white;padding:34px 38px;margin-bottom:24px;box-shadow:0 12px 30px #123d7020}
    .eyebrow{font-size:11px;letter-spacing:.18em;opacity:.8;font-weight:700}
    h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em;margin:12px 0 8px}
    .desc{margin:0;color:#e4f3fc;line-height:1.7;font-size:14px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:700}
    .primary{background:white;color:var(--navy)}.secondary{border:1px solid #ffffff80;color:white}
    .sectionhead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 0 12px}
    h2{font-size:17px;margin:0;color:var(--navy)}
    .hint{font-size:12px;color:var(--muted)}
    .viewer{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px #152d4210}
    iframe{display:block;width:100%;height:min(82vh,1050px);min-height:600px;border:0;background:#e9eef3}
    .fallback{padding:14px 18px;color:var(--muted);font-size:12px;line-height:1.6;border-top:1px solid var(--line)}
    footer{padding:22px 0;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px}
    .mobile-pdf{display:none}
    .pdf-toolbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;background:#263746;color:#fff;font-size:13px}
    .pdf-toolbar button{border:1px solid #6d8295;background:#fff;color:#17324a;border-radius:6px;padding:8px 11px;font-weight:700}
    .pdf-canvas-wrap{background:#e8edf2;padding:10px;display:flex;justify-content:center;overflow:auto;min-height:320px}
    #pdfCanvas{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 2px 10px #0002}
    .pdf-status{padding:10px;text-align:center;color:var(--muted);font-size:12px}
    .mobile-pdf-links{display:flex;justify-content:center;gap:18px;padding:12px;border-top:1px solid var(--line);font-size:13px}
    @media(max-width:600px){.top{height:68px}.brand-logo{width:185px}.tag{display:none}main{padding:24px 0 38px}.hero{padding:26px 22px}.hint{display:none}.desktop-pdf{display:none}.mobile-pdf{display:block}.viewer{border-radius:10px}}
    @media(min-width:601px){.desktop-pdf{display:block}.mobile-pdf{display:none}}
  </style>
</head>
<body>
<header><div class="wrap top">
  <img class="brand-logo" src="yt-solution-logo.png" alt="YT SOLUTION - Your Tech Solution">
  <div class="tag">FROM SENSING TO CONTROL</div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div class="eyebrow">COMPANY PROFILE · 2026</div>
    <h1>회사소개서</h1>
    <p class="desc">YT SOLUTION의 기업 소개와 주요 사업 분야, 기술 솔루션 및 프로젝트 레퍼런스를 확인해 보세요.</p>
    <div class="actions">
      <a class="btn primary" href="company-introduction.pdf" target="_blank" rel="noopener">PDF 새 창에서 보기 ↗</a>
      <a class="btn secondary" href="company-introduction.pdf" download>PDF 다운로드 ↓</a>
    </div>
  </section>
  <div class="sectionhead">
    <h2>COMPANY PROFILE</h2>
    <span class="hint">12 PAGES · PDF VIEWER</span>
  </div>
  <section class="viewer" aria-label="YT SOLUTION 회사소개서 PDF">
    <div class="desktop-pdf">
      <iframe src="company-introduction.pdf#view=FitH" title="YT SOLUTION 회사소개서 PDF"></iframe>
      <div class="fallback">문서가 표시되지 않으면 <a href="company-introduction.pdf" target="_blank" rel="noopener">PDF 파일을 새 창에서 열어</a> 확인해 주세요.</div>
    </div>
    <div class="mobile-pdf" aria-label="모바일 PDF 뷰어">
      <div class="pdf-toolbar">
        <button id="prevPage" type="button" aria-label="이전 페이지">이전</button>
        <span><b id="pageNum">1</b> / <span id="pageCount">12</span></span>
        <button id="nextPage" type="button" aria-label="다음 페이지">다음</button>
        <button id="zoomOut" type="button" aria-label="축소">−</button>
        <button id="zoomIn" type="button" aria-label="확대">＋</button>
      </div>
      <div class="pdf-canvas-wrap"><canvas id="pdfCanvas"></canvas></div>
      <div id="pdfStatus" class="pdf-status">PDF를 불러오는 중입니다…</div>
      <div class="mobile-pdf-links"><a href="company-introduction.pdf" target="_blank" rel="noopener">PDF 새 창에서 열기</a><a href="company-introduction.pdf" download>PDF 다운로드</a></div>
    </div>
  </section>
</main>
<footer><div class="wrap">© YT SOLUTION. All rights reserved.</div></footer>

<script type="module">
const pdfUrl = new URL('company-introduction.pdf', window.location.href).href;
const statusEl = document.getElementById('pdfStatus');
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
let pdfDoc = null, pageNum = 1, scale = 1, rendering = false, pendingPage = null;
async function renderPage(num) {
  if (!pdfDoc || rendering) { pendingPage = num; return; }
  rendering = true;
  try {
    const page = await pdfDoc.getPage(num);
    const wrapWidth = Math.max(280, document.querySelector('.pdf-canvas-wrap').clientWidth - 20);
    const base = page.getViewport({scale: 1});
    const fitScale = wrapWidth / base.width;
    const viewport = page.getViewport({scale: fitScale * scale});
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = `${Math.floor(viewport.width)}px`;
    canvas.style.height = `${Math.floor(viewport.height)}px`;
    await page.render({canvasContext: ctx, viewport, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null}).promise;
    pageNum = num;
    document.getElementById('pageNum').textContent = num;
    document.getElementById('prevPage').disabled = num <= 1;
    document.getElementById('nextPage').disabled = num >= pdfDoc.numPages;
    statusEl.textContent = '';
  } catch (e) { statusEl.textContent = 'PDF 페이지를 표시하지 못했습니다. 아래 새 창 열기를 이용해 주세요.'; console.error(e); }
  rendering = false;
  if (pendingPage !== null) { const next = pendingPage; pendingPage = null; renderPage(next); }
}
try {
  const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  pdfDoc = await pdfjs.getDocument({url: pdfUrl, rangeChunkSize: 65536}).promise;
  document.getElementById('pageCount').textContent = pdfDoc.numPages;
  await renderPage(1);
} catch (e) { statusEl.textContent = 'PDF 뷰어를 불러오지 못했습니다. 아래 새 창 열기 또는 다운로드를 이용해 주세요.'; console.error(e); }
document.getElementById('prevPage').addEventListener('click', () => { if (pageNum > 1) renderPage(pageNum - 1); });
document.getElementById('nextPage').addEventListener('click', () => { if (pdfDoc && pageNum < pdfDoc.numPages) renderPage(pageNum + 1); });
document.getElementById('zoomIn').addEventListener('click', () => { scale = Math.min(2.5, scale + 0.2); renderPage(pageNum); });
document.getElementById('zoomOut').addEventListener('click', () => { scale = Math.max(0.7, scale - 0.2); renderPage(pageNum); });
window.addEventListener('resize', () => { if (window.innerWidth <= 600 && pdfDoc) renderPage(pageNum); });
</script>

</body></html>
